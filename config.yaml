working_dir: "/home/rajiv/programming/dd_parser_cleaner/tests"
batch_size: 10
cleaner:
  clean_output_filename: sba_loans_clean.csv
  column_filters:
    attribute_overrides: {}
    drop_attributes: ["nan"]
    ignore_recommendations: []
  custom_logic_path: scripts/domain_logic.py
  dd_cleaner_output_dir: dd_cleaner
  handshake_file: parser_cleaner_handshake.md
  policy_manifest_file: policy_manifest.json
  derivation:
    attribute_overrides: {}
  missing_values:
    prompts:
      cleaning_assistant:
        system: "You are a data engineering assistant specializing in data quality. Analyze distributions to provide cleaning recommendations."
        recommendation_template: |
          Analyze the following dataset profile and provide cleaning recommendations in JSON:
          {profile}
    logical_defaults: {}
    attribute_overrides: {}
  pipeline:
  - integrity
  - profile      # Generates physical stats
  - assessment   # Generates cleaning_recommendations.md
  - row_filter   # Hook for custom: filter functions in domain_logic.py
  - impute       # Hook for custom: or built-in imputation
  - derive       # Hook for custom: feature engineering
  - column_filter # Terminal step: Drops unwanted attributes
  profiling_report_filename: sba_loans_profiling_report.md
  quarantine_dir: quarantine
  quarantine_filename: sba_loans_quarantine.csv
  raw_dataset_file: sba_loans_raw.csv
  row_filters:
    attribute_overrides: {}
  structural_assessment:
    auto_drop_constant: false
    dataset_type: cross-sectional (inferred)
    null_threshold: 0.95
documents_dir: documents
model_name: llama3.2
parser:
  csv_target_column_index: 0
  data_dictionary_attribute_col_name: Field Name
  data_dictionary_file: sba_dd.csv
  dd_parser_output_dir: dd_analysis_results
  entity_tagging:
  - geographic
  prompts:
    entity_classifier:
      dataset_type_template: |
        Analyze this data dictionary snippet to determine the dataset's structural type.
        Data: {sample_fields}

        CRITERIA:
        1. 'panel': Schema contains repeating attribute sets for different time periods in one row.
        2. 'cross-sectional': Data represents a single snapshot. A single reference date column (like 'asOfDate' or 'ReportDate') indicates a snapshot, NOT a panel.

        Return a strict JSON object:
        {{"dataset_type": "cross-sectional" | "panel"}}
      macro_domain_template: |
        You are a master data architect. Scan this snippet of a data dictionary blueprint:
        {sample_fields}

        Identify the macroscopic business domain (e.g., Banking, Healthcare, Insurance).
        Then, generate a list of 4 to 6 coarse-grained logical entity concepts suited to house these attributes.

        CRITICAL RULES:
        1. DO NOT lump all attributes into a single catch-all category name.
        2. Separate attributes by their intrinsic structural nature (e.g., distinguish between Demographics, Risk Profiles, Financial metrics, and Spatial/Temporal metadata).
        3. Make sure the entity concepts are granular enough to support target variations.

        Return a strict JSON object with a single key 'logical_entities' containing a list of strings.
      entity_discovery_template: |
        Classify this single data schema field:
        Field Name: {attr_str}
        Description: {desc_str}
        Physical Data Profile (Grounding Context): {stats_str}

        Instructions:
        1. Select the best match for 'entity_assignment' from these discovered choices: [{hints_str}].
        2. Evaluate dedicated boolean flags for these explicit semantic targets: {targets_str}.

        Return a strict flat JSON object exactly like this example:
        {{"entity_assignment": "YourChoice", "is_geographic": false}}
    document_processor:
      system: "You are a logic extraction engine. Your task is to read domain documentation (SOPs, narratives, or requirements) and extract thresholds, magic numbers, and validation rules into a strict JSON format."
      discovery_template: |
        {system_prompt}

        TASK: Extract domain-specific logic and rules from the provided context. 
        You may receive a Narrative Document, a Data Dictionary summary, or both.

        Output ONLY a JSON object that follows this structure:
        {{
            "metadata": {{ "domain": "string", "version": "string", "authority_source": "string" }},
            "constants": {{ "KEY": value }},
            "validation_rules": [
                {{ "rule_id": "string", "description": "string", "attribute": "string", 
                   "operator": "gt|lt|ge|le|eq|ne|in|between", "value": any, "action": "flag_warning|quarantine" }}
            ]
        }}

        CONTEXT:
        --- NARRATIVE DOCUMENT ---
        {narrative_context}

        --- DATA DICTIONARY SUMMARY ---
        {dd_context}

        Information to extract:
        - Numerical thresholds, limits, or caps.
        - Business rules requiring specific ratios or data constraints.
        - Formatting constants. IMPORTANT: Use the following keys in the "constants" object:
            1. "FORMATTING_PADDING": A map of column name tokens to their required digit width (e.g., {{"zip": 5, "id": 10}}).
            2. "FORMATTING_TITLE_CASE": A list of column name tokens that should be title-cased (e.g., ["name", "street", "city"]).
        - Other business-specific magic numbers should be at the root of the "constants" object.
  output_filename: sba_analysis_results.csv
  overrides:
    LocationID:
      is_geographic: false
      provisional_entity_assignment: Lender
system_prompt: You are a precise data engineering assistant. Respond strictly in JSON.
temperature: 0.0
