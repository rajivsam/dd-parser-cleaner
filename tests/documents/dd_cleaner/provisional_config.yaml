# 🚧 PROVISIONAL CLEANING CONFIGURATION
# Review these settings and apply to your main config.yaml

cleaner:
  column_filters:
    drop_attributes:
    - approvaldate
    - asofdate
    - chargeoffdate
    - collateralind
    - firstdisbursementdate
    - franchisecode
    - paidinfulldate
    - program
  missing_values:
    attribute_overrides:
      congressionaldistrict: mean-imputation
      naicscode: mean-imputation
  derivation:
    attribute_overrides:
      approvaldate: custom:datetime_to_numeric
      firstdisbursementdate: custom:datetime_to_numeric
      paidinfulldate: custom:datetime_to_numeric
