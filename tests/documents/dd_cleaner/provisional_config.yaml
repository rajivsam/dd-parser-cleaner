# 🚧 PROVISIONAL CLEANING CONFIGURATION
# Review these settings and apply to your main config.yaml

cleaner:
  column_filters:
    drop_attributes:
    - asofdate
    - program
    - approvaldate
    - firstdisbursementdate
    - paidinfulldate
    - chargeoffdate
  missing_values:
    attribute_overrides:
      subprogram: constant:MISSING
      naicscode: mean-imputation
      naicsdescription: constant:MISSING
      franchisecode: mean-imputation
      franchisename: constant:MISSING
      sbadistrictoffice: constant:MISSING
      congressionaldistrict: mean-imputation
      businesstype: constant:MISSING
      businessage: constant:MISSING
      loanstatus: constant:MISSING
  derivation:
    attribute_overrides:
      approvaldate: custom:datetime_to_numeric
      firstdisbursementdate: custom:datetime_to_numeric
      paidinfulldate: custom:datetime_to_numeric
