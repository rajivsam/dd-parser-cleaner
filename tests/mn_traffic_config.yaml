working_dir: /tmp/REPLACE_WORKING_DIR
batch_size: 5
model_name: llama3.2
documents_dir: documents
system_prompt: You are a precise data engineering assistant. Respond strictly in JSON.
temperature: 0.0
llm_timeout: 60.0
dataset_type: panel
dataset_id: MN_traffic
require_manifest_before_featurize: true
enable_dataset_questionnaire: false
interactive_mode: false
questionnaire_schema_path: documents/config/dataset_questions.json
handshake_require_questions: false
parser:
  data_dictionary_file: MN_traffic_dd.csv
  data_dictionary_attribute_col_name: Field Name
  csv_target_column_index: 0
  dd_parser_output_dir: dd_analysis_results
  output_filename: MN_traffic_analysis_results.csv
  dataset_manifest_filename: MN_traffic_dataset_manifest.json
  attribute_manifest_filename: MN_traffic_attribute_manifest.json
  entity_tagging: []
  prompts:
    entity_classifier:
      macro_domain_template: "You are a master data architect. Scan this snippet of a data dictionary blueprint:\n{sample_fields}\n\nThis dataset is a '{dataset_type}' dataset.\nIdentify the macroscopic business domain (e.g., Banking, Healthcare, Insurance).\nThen, generate a list of 4 to 6 coarse-grained logical entity concepts suited to house these attributes.\n\nCRITICAL RULES:\n1. DO NOT lump all attributes into a single catch-all category name.\n2. Separate attributes by their intrinsic structural nature (e.g., distinguish between Demographics, Risk Profiles, Financial metrics, and Spatial/Temporal metadata).\n3. Make sure the entity concepts are granular enough to support target variations.\n\nReturn a strict JSON object with a single key 'logical_entities' containing a list of strings."
      entity_discovery_template: "Classify this single data schema field:\nField Name: {attr_str}\nDescription: {desc_str}\nPhysical Data Profile (Grounding Context): {stats_str}\n\nInstructions:\n1. Select the best match for 'entity_assignment' from these discovered choices: [{hints_str}].\n2. Evaluate dedicated boolean flags for these explicit semantic targets: {targets_str}.\n3. The dataset type is {dataset_type}. For panel/longitudinal data, prioritize assignments that preserve repeated-measure/event structure.\n\nReturn a strict flat JSON object exactly like this example:\n{{\"entity_assignment\": \"YourChoice\", \"is_geographic\": false}}"
cleaner:
  raw_dataset_file: MN_traffic.csv
  clean_output_filename: MN_traffic_clean.csv
  metadata_table_filename: MN_traffic_metadata_table.csv
  user_cleaned_output_filename: MN_traffic_user_cleaned.csv
  dd_cleaner_output_dir: dd_cleaner
  handshake_file: mn_traffic_parser_cleaner_handshake.md
  profiling_report_filename: MN_traffic_profiling_report.md
  quarantine_dir: quarantine
  quarantine_filename: MN_traffic_quarantine.csv
  pipeline:
    - integrity
    - profile
    - assessment
  structural_assessment:
    auto_drop_constant: false
    null_threshold: 0.95
  missing_values:
    prompts:
      cleaning_assistant:
        system: You are a data engineering assistant specializing in data quality.
        recommendation_template: "Analyze the following dataset profile and provide cleaning recommendations in JSON:\n\n{profile}"
