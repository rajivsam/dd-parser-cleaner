  attribute_manifest_filename: SP_2017_weekly_product_revenue_by_product_id_attribute_manifest.json
  entity_tagging: []
  wide_short_homogeneous: true
  wide_short_representative_column: woy
  prompts:
    entity_classifier:
      macro_domain_template: 'You are a master data architect. Scan this snippet of
        a data dictionary blueprint:

        {sample_fields}


        This dataset is a ''{dataset_type}'' dataset with wide-and-short homogeneous
        structure.

        One representative column is ''{wide_short_representative_column}''.

        Identify the macroscopic business domain and generate a list of 4 to 6 coarse-grained
        logical entity concepts suited to house these attributes.


        CRITICAL RULES:

        1. DO NOT lump all attributes into a single catch-all category name.

        2. Separate attributes by their intrinsic structural nature.

        3. Give special attention to the repeated homogeneous group around ''{wide_short_representative_column}''.

        Return a strict JSON object with a single key ''logical_entities'' containing
        a list of strings.'
      entity_discovery_template: 'Classify this single data schema field:

        Field Name: {attr_str}

        Description: {desc_str}

        Physical Data Profile (Grounding Context): {stats_str}


        Instructions:

        1. Select the best match for ''entity_assignment'' from these discovered choices:
        [{hints_str}].

        2. Evaluate dedicated boolean flags for these explicit semantic targets: {targets_str}.

        3. This dataset is wide-short homogeneous and centered around the representative
        column ''{wide_short_representative_column}''.

        4. Use the representative column to distinguish repeated measures and avoid
        classifying the attribute as the primary time axis unless it is actually a
        time key.


        Return a strict flat JSON object exactly like this example:

        {{"entity_assignment": "YourChoice", "static_dynamic": "dynamic", "is_geographic":
        false}}'
