[project]
name = "dd-parser-cleaner"
version = "0.4.2"
description = "A private, local LLM-powered data dictionary parser and entity mapper with automated cleaning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rajiv", email = "rajiv@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Developers",
]
dependencies = [
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "pypdf>=4.1.0",
    "ollama>=0.2.0",
    "pyyaml>=6.0.1",
    "tabulate>=0.10.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/user/dd-parser-cleaner"
Repository = "https://github.com/user/dd-parser-cleaner"

[project.scripts]
classify-entities = "dd_parser.cli:main"
clean-dataset     = "dd_cleaner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dd_parser", "src/dd_cleaner", "src/dd_common"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = ["src/**/*.py"]
