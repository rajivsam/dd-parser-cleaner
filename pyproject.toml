[project]
name = "dd-parser-cleaner"
version = "1.6.1"
description = "A private, local LLM-powered data dictionary parser and entity mapper with automated cleaning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rajiv", email = "rajiv.sambasivan@r2-ds.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Developers",
]
dependencies = [
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "pypdf>=4.1.0",
    "ollama>=0.2.0",
    "pyyaml>=6.0.1",
    "tabulate>=0.10.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "requests>=2.34.2",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
notebook = [
    "jupyter>=1.1.1",
    "notebook>=7.5.6",
    "ipykernel>=6.29.0",
]

[project.urls]
Homepage = "https://github.com/user/dd-parser-cleaner"
Repository = "https://github.com/user/dd-parser-cleaner"

[project.scripts]
classify-entities = "dd_parser.cli:main"
clean-dataset     = "dd_cleaner.cli:main"
init-workspace    = "dd_common.workspace_cli:main"
location-helper   = "dd_common.location_cli:main"
dataset-bootstrap = "dd_common.dataset_bootstrap_cli:main"
bootstrap-config  = "dd_common.bootstrap_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dd_parser", "src/dd_cleaner", "src/dd_common", "src/dd_parser_cleaner"]
resources = ["src/dd_common/schemas/dataset_questions.json", "src/dd_common/AGENTS.md"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build]
exclude = [
  "*.csv",
  "*.pdf",
  "*.log",
  "tests/",
  "documents/",
  ".pytest_cache/",
]
